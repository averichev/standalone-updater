name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.91.1", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy --component rustfmt
      - run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - run: cargo +${{ matrix.toolchain }} clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --locked --all-features
      - run: cargo +${{ matrix.toolchain }} test --locked --no-default-features
      - run: cargo +${{ matrix.toolchain }} doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  process-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux process tests, MSRV, temporary bounded filesystem
        run: >-
          docker run --rm --init
          --tmpfs /limited:rw,exec,size=32m,mode=0700
          -v "$PWD:/work" -w /work -e CARGO_TARGET_DIR=/work/target/linux
          rust:1.91.1-bookworm python3 scripts/e2e.py --native
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit --deny warnings
